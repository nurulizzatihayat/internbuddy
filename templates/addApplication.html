<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Buddy - Application</title>
    <link rel="icon" href="static/icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-light w-100 mb-3 add-application-btn" data-bs-toggle="modal" data-bs-target="#add">
        <i class="bi bi-plus-lg mt-1"></i> Add Application
    </button>

    <div class="modal fade" id="add" tabindex="-1" data-bs-backdrop="static" aria-labelledby="newapplication" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content application-modal">
                <form method="POST" action="/addApplication">
                    <div class="modal-body"> 
                        <div> 
                            <h4 class="modal-title text-white" id="newapplication"> New Application </h4> 
                            <p class="modal-subtitle mb-3"> Add an internship application to your tracker. </p> 
                        </div>
                        <div class="modal-field"> 
                            <label for="company"> Company </label> 
                            <div class="modal-input"> 
                                <i class="bi bi-building"></i> 
                                <input type="text" id="company" name="company" placeholder="e.g. Google" required > 
                            </div> 
                        </div>

                        <div class="modal-field"> 
                            <label for="role"> Role </label> 
                            <div class="modal-input"> 
                                <i class="bi bi-briefcase"></i> 
                                <input type="text" id="role" name="role" placeholder="e.g. Software Engineering Intern" required > 
                            </div> 
                        </div>

                        <div class="modal-field"> 
                            <label for="location"> Location </label> 
                            <div class="modal-input"> 
                                <i class="bi bi-geo-alt"></i> 
                                <input type="text" id="location" name="location" placeholder="e.g. Kuala Lumpur" required > 
                            </div> 
                        </div>

                        <div class="modal-field"> 
                            <label for="category"> Category </label> 
                            <div class="modal-input"> 
                                <i class="bi bi-tag"></i> 
                                <input type="text" id="category" name="category" placeholder="e.g. Software Engineering" required > 
                            </div> 
                        </div>

                        <div class="modal-field"> 
                            <label for="website"> Website </label> 
                            <div class="modal-input"> 
                                <i class="bi bi-link-45deg"></i> 
                                <input type="text" id="website" name="website" placeholder="e.g. https://www.google.com" required > 
                            </div> 
                        </div>

                        <div class="modal-field"> 
                            <label for="allowance"> Allowance </label> 
                            <div class="modal-input"> 
                                <i class="bi bi-cash-stack"></i> 
                                <input type="text" id="allowance" name="allowance" placeholder="e.g. RM1000 or 0 if unknown" required > 
                            </div> 
                        </div>
                        <div class="mt-4 w-100 d-flex justify-content-center">
                            <button type="button" class="modal-cancel-btn" data-bs-dismiss="modal" > Cancel </button> 
                            <button type="submit" class="modal-save-btn" > Add application </button>
                        </div>
                        
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/chart.js"></script>
    
</body>
</html>
