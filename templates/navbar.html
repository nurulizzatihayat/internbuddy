<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internship Tracker">
    <meta name="author" content="Nurul Izzati">
    <link rel="icon" href="static/icon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="cursor-glow"></div>
    <section id="navigation">
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-mortarboard pe-3"></i>
                    <span class="fw-bold small">InternBuddy</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="/application"><i class="bi bi-file-earmark-text pe-2"></i>Application</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="/discover"><i class="bi bi-search pe-2"></i>Discover</a>
                        </li>
                        {% if "username_session" in session %}
                            <li class="nav-item">
                                <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right pe-2"></i>Log Out</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link btn btn-light px-3 rounded-pill btn-sm text-dark ms-4" disabled><i class="bi bi-person-fill pe-2"></i>{{session["username_session"]}}</a>
                            </li>
                        {% else %}
                            <li class="nav-item">
                                <a class="nav-link" href="/login"><i class="bi bi-person-fill pe-2"></i>Login / Register</a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
            
        </nav>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script>
        const cursorGlow = document.getElementById("cursor-glow");

        document.addEventListener("mousemove", (e) => {
            cursorGlow.style.left = e.clientX + "px";
            cursorGlow.style.top = e.clientY + "px";
        });
    </script>
</body>
</html>
