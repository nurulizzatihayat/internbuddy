<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internship Tracker">
    <meta name="author" content="Nurul Izzati">
    <link rel="icon" href="static/icon.png">
    <title>Reset Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "navbar.html" %}
    <section id="login" class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-11 col-sm-8 col-md-5 col-lg-4">

                    <div class="mb-4">
                        <h1 class="fw-bold text-white mb-2">Reset Password</h1>
                        <p class="text-white-50 mb-0">
                            Create a new password for your account.
                        </p>
                    </div>

                    {% include "toast.html" %}

                    <form method="POST" action="{{ url_for('resetpassword', token=token) }}">

                        <div class="mb-4">
                            <label class="form-label text-white small fw-semibold">
                                New Password
                            </label>

                            <div class="input-group">
                                <span class="input-group-text bg-transparent text-white border-secondary">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input type="password" class="form-control bg-transparent text-white border-secondary" placeholder="Enter your new password" name="password" required>
                            </div>

                            <div class="form-text text-white-50 mt-2">
                                Use 8–20 characters with letters, numbers, and a special character.
                            </div>
                        </div>


                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-light py-2 fw-semibold">
                                Reset Password
                            </button>
                        </div>


                        <div class="text-center">
                            <a href="/login"
                            class="text-white-50 text-decoration-none small">
                                ← Cancel and return to Log In
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
