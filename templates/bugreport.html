<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Internship Tracker">
    <meta name="author" content="Nurul Izzati">
    <link rel="icon" href="static/icon.png">
    <title>Report Bug</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% include "navbar.html" %}
    <section id="login" class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <h1 class="fw-bold text-white">Report Bug</h1>
                    {% include "toast.html" %}
                    <form method="POST" action="/reportbug">
                        <div class="mb-3">
                            <label class="form-label text-white">Bug Description</label>
                            <div class="input-group">
                                <span class="input-group-text" data-bs-toggle="tooltip" data-bs-placement="right" title="Describe the bug you encountered">
                                    <i class="bi bi-bug"></i>
                                </span>
                                <textarea class="form-control" placeholder="Describe the bug you encountered" name="bug_description" rows="4" required></textarea>
                            </div>
                        </div>
                        
                        <div class="d-flex gap-3 py-3">
                            <a href="/"class="btn btn-outline-light w-100">Cancel</a>
                            <button type="submit" class="btn btn-light w-100">Report Bug</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
